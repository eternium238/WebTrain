<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="lab2secPart1.css">
    </head>
<body>
	  <form id="triangleForm">
        <div class="row">
      <h4>Point 1:</h4> 
      <h4>Point 2:</h4>
      <h4>Point 3:</h4>
      </div><br>
        <label>X1: <input type="number" id="X1" step="any" value="1" onfocus=onfoc()></label>
        <label>X2: <input type="number" id="X2" step="any" value="2" onfocus=onfoc()></label>
        <label>X3: <input type="number" id="X3" step="any" value="2" onfocus=onfoc()></label><br>
        <label>Y1: <input type="number" id="Y1" step="any" value="1" onfocus=onfoc()></label>
        <label>Y2: <input type="number" id="Y2" step="any" value="2" onfocus=onfoc()></label>
        <label>Y3: <input type="number" id="Y3" step="any" value="1" onfocus=onfoc()></label><br>
        <br>
      <button type="button" onclick="calculateArea()">Calculate Area</button>
    </form>
    <h3>Result:</h3>
    <input type="text" id="Res" readonly size="30"><br><br><br>
  </body>
  <script>
        let ax = document.getElementById('X1');
        let ay = document.getElementById('Y1');
        let bx = document.getElementById('X2');
        let by = document.getElementById('Y2');
        let cx = document.getElementById('X3');
        let cy = document.getElementById('Y3');
        let result = document.getElementById('Res');

        function getDistance(x1, y1, x2, y2) {
            return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
        }

        function calculateArea() {
            let x1 = parseFloat(ax.value) || 0;
            let y1 = parseFloat(ay.value) || 0;
            let x2 = parseFloat(bx.value) || 0;
            let y2 = parseFloat(by.value) || 0;
            let x3 = parseFloat(cx.value) || 0;
            let y3 = parseFloat(cy.value) || 0;

            let a = getDistance(x1, y1, x2, y2);
            let b = getDistance(x2, y2, x3, y3);
            let c = getDistance(x3, y3, x1, y1);

            if (a + b <= c || a + c <= b || b + c <= a) {
                result.value = 'Треугольник не существует';
                return;
            }
            let p = (a + b + c) / 2;
            let area = Math.sqrt(p * (p - a) * (p - b) * (p - c));
            result.value = area.toFixed(4);
        }
        function onfoc()
        {
            result.value="";
        }
        calculateArea();
  </script>
</html>
