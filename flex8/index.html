<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox задание</title>
    <style>
        .container {
            border: 2px solid rgb(228, 194, 0);
            padding: 10px;
            border-radius: 10px;
            width: 500px;
            height: 500px;
            color: rgb(255, 255, 255);
            font-size: 1.2rem;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: flex-start;
            align-items: stretch;
        }
        .elem {
            background-color: rgb(250, 130, 32);
            width: 70px;
            height: 25px;
            margin: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .elem-1 { order: 5; align-self: stretch; height: auto; }
        .elem-2 { order: 4; align-self: stretch; height: auto; }
        .elem-3 { order: 3; align-self: stretch; height: auto; }
        .elem-4 { order: 2; align-self: stretch; height: auto; }
        .elem-5 { order: 1;  align-self: flex-start; width:40%}
        .elem-6 { order: 10; align-self: stretch; height: auto; }
        .elem-7 { order: 9; align-self: stretch; height: auto; }
        .elem-8 { order: 8; align-self: stretch; height: auto; }
        .elem-9 { order: 7; align-self: stretch; height: auto; }
        .elem-10 { order: 6;  align-self: flex-start; width:40%}
    </style>
</head>
<body>
    <div class="container">
        <div class="elem elem-1">1</div>
        <div class="elem elem-2">2</div>
        <div class="elem elem-3">3</div>
        <div class="elem elem-4">4</div>
        <div class="elem elem-5">5</div>
        <div class="elem elem-6">6</div>
        <div class="elem elem-7">7</div>
        <div class="elem elem-8">8</div>
        <div class="elem elem-9">9</div>
        <div class="elem elem-10">10</div>
    </div>
</body>
</html>
